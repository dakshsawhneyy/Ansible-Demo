

# tasks:
- name: update system
  apt:
    name: "*"
    state: latest
    
- name: Install Docker.io
  apt: 
    name: docker.io
    state: latest
    
- name: Add users to Docker group
  user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

# Handler
- name: Restart Docker
  service: 
    name: docker
    state: restarted
  become: yes

- name: Register Docker Version
  command: docker --version
  register: docker_version
    
- name: Show Docker Version
  debug:
    msg: "{{ docker_version }}"

- name: Show Running Containers
  command: docker ps

# Create Playbook
---
- name: Install Docker
  hosts: servers
  become: yes
  roles:
    - docker
